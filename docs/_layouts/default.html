<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem;
           margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
    .audio-link { display: inline-flex; align-items: center; gap: .5rem;
                  text-decoration: none; font-weight: 600; }
    .audio-link svg { width: 1.5rem; height: 1.5rem; }
    figure { margin: 1.5rem 0; }
    audio { width: 100%; }
  </style>
</head>
<body>
  <h1>{{ page.title }}</h1>

  {{ content }}

  {% if page.audio %}
 <figure>
    <figcaption>Listen</figcaption>
    <audio controls preload="none" src="{{ page.audio | relative_url }}">
      Your browser doesn't support the audio element.
      <a href="{{ page.audio | relative_url }}">Download the audio</a>.
    </audio>
  </figure>
  {% endif %}
</body>
</html>
